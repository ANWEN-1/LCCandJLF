<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-preset-bubbles@2/tsparticles.preset.bubbles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

    <style>
        /* === 粒子背景容器 === */
        #tsparticles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* 放在最底层 */
            pointer-events: auto;
            /* 允许鼠标交互 */
        }

        /* === 保证卡片、按钮等在粒子上方，并且能被点击 === */
        .card,
        footer,
        .toggle-wrapper,
        .click-emoji {
            position: relative;
            z-index: 10;
        }

        /* === 搜索框容器 === */
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 20px 0;
            z-index: 100;
        }

        /* 输入框本体 */
        .search-input {
            width: 100%;
            padding: 12px 20px;
            padding-left: 45px;
            border-radius: 30px;
            border: 2px solid #e0e0e0;
            background: rgba(255, 255, 255, 0.9);
            /* 稍微变透明一点，透出后面的粒子 */
            backdrop-filter: blur(5px);
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
            /* === 下面这两行是关键 === */
            z-index: 10;
            /* 让图标强行浮在毛玻璃输入框的上方 */
            pointer-events: none;
            /* 让鼠标点击能直接“穿透”图标点到输入框里 */
        }

        .search-input:focus {
            border-color: #87CEEB;
            box-shadow: 0 0 10px rgba(135, 206, 235, 0.3);
        }

        /* === 搜索结果下拉菜单 === */
        .search-results {
            position: absolute;
            top: 50px;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-height: 300px;
            overflow-y: auto;
            display: none;
            text-align: left;
            overflow: hidden;
        }

        .search-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
            text-decoration: none;
            transition: 0.2s;
        }

        .search-item:hover {
            background: #f9f9f9;
            padding-left: 20px;
        }

        .search-item:last-child {
            border-bottom: none;
        }

        .search-item .type-icon {
            font-size: 18px;
        }

        .search-item .item-title {
            font-size: 14px;
            font-weight: bold;
        }

        .search-item .item-sub {
            font-size: 12px;
            color: #888;
            margin-left: auto;
        }

        /* 黑夜模式搜索框适配 */
        body.dark-mode .search-input {
            background: rgba(43, 50, 77, 0.85);
            border-color: #444;
            color: white;
        }

        body.dark-mode .search-results {
            background: rgba(43, 50, 77, 0.95);
            border: 1px solid #444;
        }

        body.dark-mode .search-item {
            border-bottom-color: #444;
            color: #eee;
        }

        body.dark-mode .search-item:hover {
            background: #384260;
        }

        /* === 1. 网页整体布局 === */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e8eef5;
            transition: background-color 0.5s ease;
        }

        /* === 2. 你的个人介绍卡片样式 === */
        .card {
            background: rgba(255, 255, 255, 0.85);
            /* 半透明，让背景粒子透出来 */
            backdrop-filter: blur(10px);
            /* 毛玻璃特效 */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            transition: all 0.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.1);
        }

        h1 {
            color: #333;
            margin: 0 0 10px 0;
            transition: color 0.5s ease;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin: 5px 0;
            transition: color 0.5s ease;
        }

        /* === 3. 右上角开关的容器设置 === */
        .toggle-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            transform: scale(0.4);
            transform-origin: top right;
        }

        .toggle-checkbox {
            display: none;
        }

        .toggle-label {
            width: 180px;
            height: 80px;
            background-color: #87CEEB;
            border-radius: 80px;
            position: relative;
            cursor: pointer;
            display: block;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.2), inset 0 -4px 8px rgba(255, 255, 255, 0.8), 0 8px 15px rgba(0, 0, 0, 0.1);
            border: 6px solid #dbe4ef;
            transition: background-color 0.5s ease;
        }

        .background-day {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            transition: 0.5s;
        }

        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.9;
        }

        .cloud-1 {
            width: 60px;
            height: 60px;
            left: 60px;
            bottom: -30px;
        }

        .cloud-2 {
            width: 50px;
            height: 50px;
            left: 90px;
            bottom: -20px;
            z-index: 2;
        }

        .cloud-3 {
            width: 70px;
            height: 70px;
            right: 10px;
            bottom: -35px;
        }

        .cloud-4 {
            width: 40px;
            height: 40px;
            right: 60px;
            bottom: -15px;
            opacity: 0.7;
        }

        .background-night {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to right, #1a2340, #2b324d);
            opacity: 0;
            transform: translateX(-100%);
            transition: 0.5s;
        }

        /* === 黑夜模式专用样式 === */
        body.dark-mode .btn {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.dark-mode {
            background-color: #1a2340 !important;
        }

        body.dark-mode .card {
            background-color: rgba(43, 50, 77, 0.85) !important;
            /* 同样加入半透明毛玻璃 */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important;
        }

        body.dark-mode h1,
        body.dark-mode #my-title {
            color: #fff !important;
        }

        body.dark-mode p {
            color: #ccc !important;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        .star-1 {
            width: 8px;
            height: 8px;
            top: 20px;
            left: 40px;
        }

        .star-2 {
            width: 6px;
            height: 6px;
            top: 45px;
            left: 70px;
        }

        .star-3 {
            width: 5px;
            height: 5px;
            top: 15px;
            left: 90px;
        }

        .dot {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0.6;
        }

        .dot-1 {
            width: 3px;
            height: 3px;
            top: 50px;
            left: 20px;
        }

        .dot-2 {
            width: 2px;
            height: 2px;
            top: 30px;
            left: 60px;
        }

        .toggle-button {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: #FFD54F;
            box-shadow: inset 0 -3px 5px rgba(0, 0, 0, 0.1), 0 2px 5px rgba(0, 0, 0, 0.2), 0 0 10px 2px rgba(253, 216, 53, 0.4);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 10;
            overflow: hidden;
        }

        .crater {
            position: absolute;
            background-color: #9aa7b5;
            border-radius: 50%;
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: 0.3s;
        }

        .crater-1 {
            width: 20px;
            height: 20px;
            top: 10px;
            left: 25px;
        }

        .crater-2 {
            width: 10px;
            height: 10px;
            top: 40px;
            left: 15px;
        }

        .crater-3 {
            width: 8px;
            height: 8px;
            top: 35px;
            left: 45px;
        }

        .toggle-checkbox:checked+.toggle-label .toggle-button {
            transform: translateX(100px);
            background: #eef2f5;
            box-shadow: inset 0 -3px 5px rgba(0, 0, 0, 0.1), 0 2px 5px rgba(0, 0, 0, 0.3), 0 0 15px 3px rgba(255, 255, 255, 0.4);
        }

        .toggle-checkbox:checked+.toggle-label .toggle-button .crater {
            opacity: 1;
        }

        .toggle-checkbox:checked+.toggle-label .background-day {
            transform: translateY(100%);
            opacity: 0;
        }

        .toggle-checkbox:checked+.toggle-label .background-night {
            transform: translateX(0);
            opacity: 1;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #1a2340;
            border-color: #576075;
        }

        /* === 新增：主页按钮样式 === */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-top: 30px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 15px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            border: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: scale(0.98);
        }

        footer {
            margin-top: 50px;
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 14px;
        }

        .social-links {
            margin-top: 10px;
        }

        .social-links a {
            text-decoration: none;
            font-size: 24px;
            margin: 0 10px;
            transition: transform 0.3s;
            display: inline-block;
        }

        .social-links a:hover {
            transform: scale(1.2) rotate(10deg);
        }

        body.dark-mode footer {
            color: #555;
        }

        .click-emoji {
            position: fixed;
            pointer-events: none;
            user-select: none;
            z-index: 9999;
            font-size: 24px;
            animation: moveUpAndFade 1.2s ease-out forwards;
        }

        @keyframes moveUpAndFade {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -200%) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>

    <script>
        function showWelcome() {
            const div = document.createElement('div');
            div.textContent = "✨ 你好！你好！你好！";
            div.style.cssText = `
                position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.8); color: white; padding: 20px 40px;
                border-radius: 50px; font-size: 16px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                z-index: 9999; opacity: 0; transition: opacity 0.5s;

            document.body.appendChild(div);
            requestAnimationFrame(() => div.style.opacity = '1');

        function checkAlbumPassword() {

            if (password === correctPassword) {
                window.location.href = "SecondSheet/album.html";

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                if (text.includes('@qq.com')) alert('QQ邮箱已复制到剪贴板！');
                else if (text.includes('@gmail.com')) alert('Gmail邮箱已复制到剪贴板！');
                else alert('内容已复制到剪贴板！');
            }).catch(err => console.error('复制失败:', err));
        }
    </script>

    <script>
        // 搜索功能
        const searchInput = document.getElementById('global-search');
        const resultsBox = document.getElementById('search-results-box');
        let searchableData = [
            { title: "我的相册", type: "功能", url: "SecondSheet/album.html", icon: "📸" },
            { title: "3D 模型展示", type: "功能", url: "SecondSheet/model.html", icon: "🧊" },
            { title: "音乐播放器", type: "功能", url: "SecondSheet/music.html", icon: "🎵" },
            { title: "留言墙", type: "功能", url: "SecondSheet/guestbook.html", icon: "💬" },
            { title: "我的简历", type: "简历", url: "SecondSheet/resume.html", icon: "📄" },
            { title: "弹性考勤计算器", type: "功能", url: "SecondSheet/attendance.html", icon: "⏱️" }
        ];

        Promise.all([
            fetch('data/tutorials.json').then(res => res.ok ? res.json() : []),
            fetch('data/music.json').then(res => res.ok ? res.json() : [])
        ]).then(([tutorials, music]) => {
            tutorials.forEach(t => searchableData.push({ title: t.title, type: "教程", url: t.link, icon: "📚", isExternal: true }));
            music.forEach(m => searchableData.push({ title: m.title + " - " + m.artist, type: "音乐", url: "music.html", icon: "🎧" }));
        });

        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            resultsBox.innerHTML = '';
            if (keyword.length === 0) { resultsBox.style.display = 'none'; return; }
            const results = searchableData.filter(item => item.title.toLowerCase().includes(keyword));
            if (results.length > 0) {
                resultsBox.style.display = 'block';
                results.forEach(item => {
                    const link = document.createElement('a');
                    link.className = 'search-item';
                    link.href = item.url;
                    if (item.isExternal) link.target = "_blank";
                    link.innerHTML = `<span class="type-icon">${item.icon}</span><span class="item-title">${item.title}</span><span class="item-sub">${item.type}</span>`;
                    resultsBox.appendChild(link);
                });
            } else {
                resultsBox.style.display = 'block';
                resultsBox.innerHTML = `<div class="search-item" style="color:#999; justify-content:center;">暂无搜索结果</div>`;
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) resultsBox.style.display = 'none';
        });

        // 鼠标点击掉落 emoji
        document.addEventListener('click', function (e) {
            // 防止点击右上角的深色模式按钮时，或者在拖动卡片文字时意外触发过多的 emoji
            if (e.target.closest('.toggle-wrapper')) return;

            const emojis = ["❤️", "⭐", "✨", "😊", "🔥", "🌈", "🎈", "🌸", "😍", "🤣", "😂", "😎", "😘", "💕", "🥰", "🤩", "😜", "😛"];
            const span = document.createElement('span');
            span.className = 'click-emoji';
            span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            span.style.left = e.clientX + 'px';
            span.style.top = e.clientY + 'px';
            const randomRotation = (Math.random() - 0.5) * 40;
            span.style.transform = `translate(-50%, -50%) rotate(${randomRotation}deg)`;
            document.body.appendChild(span);
            setTimeout(() => span.remove(), 1200);
        });
    </script>

    <script>
        // 定义一个函数来生成粒子的配置（根据白天/黑夜改变颜色）
        const getParticlesConfig = (isDark) => {
            // 白天用清新的蓝色，黑夜用发光的青蓝色
            const particleColor = isDark ? "#00f2fe" : "#4facfe";
            const lineColor = isDark ? "#ffffff" : "#4facfe";

            return {
                fpsLimit: 60,
                interactivity: {
                    events: {
                        onHover: {
                            enable: true,
                            mode: "grab", // grab 模式：鼠标靠近时会吸附线条
                        },
                        onClick: {
                            enable: true,
                            mode: "push", // 点击时额外生成几个粒子
                        },
                        resize: true,
                    },
                    modes: {
                        grab: {
                            distance: 180,
                            links: { opacity: 0.6 } // 吸附线条的透明度
                        },
                        push: { quantity: 3 }, // 每次点击发射3个
                    },
                },
                particles: {
                    color: { value: particleColor },
                    links: {
                        color: lineColor,
                        distance: 150,
                        enable: true, // 开启粒子之间的连线
                        opacity: isDark ? 0.3 : 0.4,
                        width: 1,
                    },
                    move: {
                        enable: true,
                        speed: 1.5, // 粒子飘动的速度
                        direction: "none",
                        random: false,
                        straight: false,
                        outModes: "out",
                    },
                    number: {
                        density: { enable: true, area: 800 },
                        value: 60, // 屏幕上的粒子总数（别调太大，会卡）
                    },
                    opacity: { value: 0.6 },
                    shape: { type: "circle" },
                    size: { value: { min: 1, max: 3 } },
                },
                detectRetina: true, // 适配高分屏
            };
        };

        // 核心渲染逻辑
        const renderParticles = () => {
            const isDark = document.body.classList.contains('dark-mode');
            tsParticles.load("tsparticles", getParticlesConfig(isDark));
        };

        // 1. 等待页面加载完毕后，根据当前主题渲染一次
        window.addEventListener('DOMContentLoaded', () => {
            // 给 theme.js 一点点时间去读取本地存储和添加类名
            setTimeout(renderParticles, 100);
        });

        // 2. 监听页面的类名变化（当点击右上角切换黑夜模式时，重新加载对应的颜色）
        const themeObserver = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'class') {
                    renderParticles();
                }
            });
        });
        themeObserver.observe(document.body, { attributes: true });
    </script>
</body>

</html>
