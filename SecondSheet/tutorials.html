<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教程与资源分享</title>
    <style>
        /* === 基础设置 === */
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
            transition: background-color 0.3s;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        h1 {
            margin: 10px 0;
            color: #2c3e50;
        }

        p {
            color: #7f8c8d;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #666;
            border: 1px solid #ccc;
            padding: 8px 20px;
            border-radius: 20px;
            background: white;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #333;
            color: white;
            border-color: #333;
        }

        /* === 资源网格布局 === */
        .resource-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* === 单个资源卡片 === */
        .resource-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .resource-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            border-color: #a18cd1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .icon {
            font-size: 32px;
        }

        .tag {
            background-color: #e8eef5;
            color: #555;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .card-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        .link-hint {
            margin-top: auto;
            font-size: 13px;
            color: #a18cd1;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* === 新增：缩略图样式 === */
        .card-thumbnail {
            width: 100%;
            height: 150px;
            object-fit: cover;
            /* 保证图片铺满不变形 */
            border-radius: 8px;
            margin-bottom: 15px;
            cursor: zoom-in;
            /* 鼠标放上去显示放大镜 */
            border: 1px solid #eee;
            transition: opacity 0.2s;
        }

        .card-thumbnail:hover {
            opacity: 0.9;
        }

        /* === 新增：大图查看器 (Lightbox) === */
        .lightbox {
            display: none;
            /* 默认隐藏 */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            /* 黑色半透明背景 */
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            animation: zoomIn 0.3s ease;
        }

        .lightbox-close {
            margin-top: 20px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* === 黑夜模式适配 === */
        body.dark-mode {
            background-color: #1a2340 !important;
            color: #eee !important;
        }

        body.dark-mode .resource-card {
            background-color: #2b324d !important;
            color: #fff !important;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3) !important;
        }

        body.dark-mode .tag {
            background-color: #384260 !important;
            color: #ccc !important;
        }

        body.dark-mode .card-title {
            color: #fff !important;
        }

        body.dark-mode .card-desc {
            color: #ccc !important;
        }

        body.dark-mode .back-btn {
            background-color: #384260 !important;
            color: #fff !important;
            border-color: #555 !important;
        }

        body.dark-mode h1 {
            color: #fff !important;
        }

        body.dark-mode p {
            color: #ccc !important;
        }

        body.dark-mode .card-thumbnail {
            border-color: #444;
        }
    </style>
</head>

<body>

    <header>
        <a href="../index.html" class="back-btn">← 返回主页</a>
        <h1>📚 教程与资源</h1>
        <p>收集整理我的学习笔记和常用工具链接</p>
    </header>

    <div class="resource-grid" id="grid-box">
    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="大图">
        <div class="lightbox-close">&times;</div>
    </div>

    <script src="../assets/js/theme.js"></script>

    <script>
        const gridBox = document.getElementById('grid-box');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        // 打开大图函数
        function openLightbox(event, imgSrc) {
            // 核心：阻止事件冒泡和默认行为（防止点击图片时跳转网页）
            event.preventDefault();
            event.stopPropagation();

            // 显示大图
            lightboxImg.src = imgSrc;
            lightbox.style.display = "flex";
        }

        // 关闭大图函数
        function closeLightbox() {
            lightbox.style.display = "none";
        }

        // 读取 data/tutorials.json
        fetch('../data/tutorials.json')
            .then(response => response.json())
            .then(data => {
                data.forEach(item => {
                    // 创建超链接卡片
                    const link = document.createElement('a');
                    link.className = 'resource-card';
                    link.href = item.link;
                    link.target = "_blank"; // 在新标签页打开

                    // 1. 判断是否有图片，生成图片的 HTML
                    let imageHtml = '';
                    if (item.image && item.image.trim() !== "") {
                        // 注意：onclick 调用了 openLightbox
                        const imagePath = `../${item.image}`;
                        imageHtml = `<img src="${imagePath}" class="card-thumbnail" onclick="openLightbox(event, '${imagePath}')" alt="预览图">`;
                    }

                    // 2. 组装卡片内容
                    link.innerHTML = `
                        <div class="card-header">
                            <span class="icon">${item.icon}</span>
                            <span class="tag">${item.tag}</span>
                        </div>
                        ${imageHtml} <div class="card-title">${item.title}</div>
                        <div class="card-desc">${item.desc}</div>
                        <div class="link-hint">点击查看详情 ↗</div>
                    `;
                    gridBox.appendChild(link);
                });
            })
            .catch(err => console.error("读取失败:", err));
    </script>

</body>

</html>
