<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>弹性考勤计算器</title>
    <style>
        /* === 1. 颜色变量定义（包含白天和黑夜） === */
        :root {
            --primary-color: #5b52cc;
            --primary-hover: #4a42a8;
            --bg-color: #e8eef5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #333333;
            --text-sub: #888888;
            --box-bg-purple: #f4f4fa;
            --box-bg-green: #eefaf3;
            --text-green: #10b981;
            --input-bg: #f5f6f8;
            --timeline-line: #eeeeee;
        }

        body.dark-mode {
            --primary-color: #7c73e6;
            --primary-hover: #9b94ed;
            --bg-color: #1a2340;
            --card-bg: rgba(43, 50, 77, 0.85);
            --text-main: #ffffff;
            --text-sub: #a0a7b5;
            --box-bg-purple: #2b2d42;
            --box-bg-green: #1e362d;
            --text-green: #34d399;
            --input-bg: #202840;
            --timeline-line: #444444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
            color: var(--text-main);
            transition: background-color 0.5s ease;
        }

        /* === 返回按钮 === */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            color: var(--text-main);
            text-decoration: none;
            border: 1px solid var(--text-sub);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var(--text-main);
            color: var(--bg-color);
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 10;
        }

        /* 头部标题区域 */
        .header {
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            color: var(--primary-color);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: color 0.5s;
        }

        .header p {
            font-size: 13px;
            color: var(--text-sub);
            transition: color 0.5s;
        }

        /* 主卡片区域 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.5s ease;
        }

        body.dark-mode .card {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 输入框区域 */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .input-wrapper {
            background: var(--input-bg);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            transition: background 0.5s;
        }

        input[type="time"] {
            background: transparent;
            border: none;
            outline: none;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-main);
            width: 100%;
            cursor: pointer;
            color-scheme: light dark;
        }

        /* 按钮 */
        .btn-calc {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 24px;
        }

        .btn-calc:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(91, 82, 204, 0.3);
        }

        .btn-calc:active {
            transform: scale(0.98);
        }

        /* 结果展示卡片 */
        .result-box {
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
            animation: fadeIn 0.4s ease;
            transition: background 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .box-start {
            background-color: var(--box-bg-purple);
        }

        .box-end {
            background-color: var(--box-bg-green);
        }

        .result-label {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .result-time-start {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .result-time-end {
            font-size: 32px;
            font-weight: bold;
            color: var(--text-green);
            margin: 4px 0;
        }

        /* 推理过程时间轴 */
        .reasoning-container {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.4s ease 0.1s both;
        }

        .reasoning-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .timeline {
            position: relative;
            padding-left: 16px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 6px;
            bottom: 6px;
            width: 2px;
            background-color: var(--timeline-line);
            transition: background 0.5s;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.5;
        }

        .dot {
            position: absolute;
            left: -16px;
            top: 6px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--primary-color);
            border: 2px solid var(--card-bg);
            box-shadow: 0 0 0 1px var(--primary-color);
            transition: border-color 0.5s;
        }

        .dot-break {
            background-color: #f59e0b;
            box-shadow: 0 0 0 1px #f59e0b;
        }

        .time-range {
            font-weight: 600;
            color: var(--text-main);
        }

        .duration {
            color: var(--text-sub);
            margin-left: 6px;
        }

        /* 规则说明与警告框 */
        .rules-box {
            font-size: 12px;
            color: var(--text-sub);
            background: var(--input-bg);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .rules-box strong {
            color: var(--text-main);
        }

        .warning-box {
            color: #b91c1c;
            background: #fee2e2;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 13px;
            text-align: center;
            border: 1px solid #fca5a5;
            animation: fadeIn 0.4s ease;
        }

        body.dark-mode .warning-box {
            color: #fca5a5;
            background: #451a1a;
            border-color: #7f1d1d;
        }

        /* === 昼夜切换开关样式 === */
        .toggle-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            transform: scale(0.35);
            transform-origin: top right;
            z-index: 1000;
        }

        .toggle-checkbox {
            display: none;
        }

        .toggle-label {
            width: 180px;
            height: 80px;
            background-color: #87CEEB;
            border-radius: 80px;
            position: relative;
            cursor: pointer;
            display: block;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.2), inset 0 -4px 8px rgba(255, 255, 255, 0.8), 0 8px 15px rgba(0, 0, 0, 0.1);
            border: 6px solid #dbe4ef;
            transition: background-color 0.5s ease;
        }

        .background-day,
        .background-night {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            transition: 0.5s;
        }

        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.9;
        }

        .cloud-1 {
            width: 60px;
            height: 60px;
            left: 60px;
            bottom: -30px;
        }

        .cloud-2 {
            width: 50px;
            height: 50px;
            left: 90px;
            bottom: -20px;
            z-index: 2;
        }

        .cloud-3 {
            width: 70px;
            height: 70px;
            right: 10px;
            bottom: -35px;
        }

        .cloud-4 {
            width: 40px;
            height: 40px;
            right: 60px;
            bottom: -15px;
            opacity: 0.7;
        }

        .background-night {
            background: linear-gradient(to right, #1a2340, #2b324d);
            opacity: 0;
            transform: translateX(-100%);
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        .star-1 {
            width: 8px;
            height: 8px;
            top: 20px;
            left: 40px;
        }

        .star-2 {
            width: 6px;
            height: 6px;
            top: 45px;
            left: 70px;
        }

        .star-3 {
            width: 5px;
            height: 5px;
            top: 15px;
            left: 90px;
        }

        .dot-star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0.6;
        }

        .dot-star-1 {
            width: 3px;
            height: 3px;
            top: 50px;
            left: 20px;
        }

        .dot-star-2 {
            width: 2px;
            height: 2px;
            top: 30px;
            left: 60px;
        }

        .toggle-button {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: #FFD54F;
            box-shadow: inset 0 -3px 5px rgba(0, 0, 0, 0.1), 0 2px 5px rgba(0, 0, 0, 0.2), 0 0 10px 2px rgba(253, 216, 53, 0.4);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 10;
            overflow: hidden;
        }

        .crater {
            position: absolute;
            background-color: #9aa7b5;
            border-radius: 50%;
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: 0.3s;
        }

        .crater-1 {
            width: 20px;
            height: 20px;
            top: 10px;
            left: 25px;
        }

        .crater-2 {
            width: 10px;
            height: 10px;
            top: 40px;
            left: 15px;
        }

        .crater-3 {
            width: 8px;
            height: 8px;
            top: 35px;
            left: 45px;
        }

        .toggle-checkbox:checked+.toggle-label .toggle-button {
            transform: translateX(100px);
            background: #eef2f5;
            box-shadow: inset 0 -3px 5px rgba(0, 0, 0, 0.1), 0 2px 5px rgba(0, 0, 0, 0.3), 0 0 15px 3px rgba(255, 255, 255, 0.4);
        }

        .toggle-checkbox:checked+.toggle-label .toggle-button .crater {
            opacity: 1;
        }

        .toggle-checkbox:checked+.toggle-label .background-day {
            transform: translateY(100%);
            opacity: 0;
        }

        .toggle-checkbox:checked+.toggle-label .background-night {
            transform: translateX(0);
            opacity: 1;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #1a2340;
            border-color: #576075;
        }
    </style>
</head>

<body>

    <div class="toggle-wrapper">
        <input type="checkbox" id="day-night-switch" class="toggle-checkbox">
        <label for="day-night-switch" class="toggle-label">
            <div class="background-night">
                <span class="star star-1"></span><span class="star star-2"></span><span class="star star-3"></span>
                <span class="dot-star dot-star-1"></span><span class="dot-star dot-star-2"></span>
            </div>
            <div class="background-day">
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
                <div class="cloud cloud-4"></div>
            </div>
            <div class="toggle-button">
                <span class="crater crater-1"></span><span class="crater crater-2"></span><span
                    class="crater crater-3"></span>
            </div>
        </label>
    </div>

    <a href="../index.html" class="back-btn">← 返回主页</a>

    <div class="app-container">
        <div class="header">
            <h1>
                ⏱️ 弹性考勤计算器
            </h1>
        </div>

        <div class="card">
            <div class="rules-box">
                <div style="margin-bottom: 4px;">📅 <strong>工时要求：</strong>每日平均 7小时45分</div>
                <div style="margin-bottom: 4px;">⏰ <strong>有效时段：</strong>最早 6:00，最晚 21:00</div>
                <div style="margin-bottom: 4px;">☕ <strong>休息扣除：</strong>午休 12:00-13:45 | 晚休 19:00-19:30</div>
                <div>⏱️ <strong>取整规则：</strong>上班向后取整30分 (例: 8:01计为8:30)</div>
            </div>

            <div class="section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)"
                    stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                今日下班计算
            </div>

            <div class="input-group">
                <label>实际打卡时间</label>
                <div class="input-wrapper">
                    <input type="time" id="actualTime" required>
                </div>
            </div>

            <button class="btn-calc" onclick="calculateTime()">计算下班时间</button>

            <div class="result-box box-start" id="startBox">
                <div class="result-label">计入系统的上班时间</div>
                <div class="result-time-start" id="effectiveStart">09:00</div>
            </div>

            <div class="result-box box-end" id="endBox">
                <div class="result-label">建议最晚打卡时间</div>
                <div class="result-time-end" id="targetEnd">18:30</div>
                <div class="result-label" style="font-size: 12px; margin-top: 4px;">(需满7小时45分)</div>
            </div>

            <div id="warningBoxContainer"></div>

            <div class="reasoning-container" id="reasoningBox">
                <div class="reasoning-title">推理过程</div>
                <div class="timeline" id="timelineContent"></div>
            </div>
        </div>
    </div>

    <script src="../assets/js/theme.js"></script>

    <script>
        window.onload = () => {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('actualTime').value = `${hh}:${mm}`;
        };

        function formatTime(mins) {
            let h = Math.floor(mins / 60);
            let m = mins % 60;
            if (h >= 24) h -= 24;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function calculateTime() {
            const timeStr = document.getElementById('actualTime').value;
            if (!timeStr) return;

            let [hours, minutes] = timeStr.split(':').map(Number);
            let effMin = Math.ceil(minutes / 30) * 30;
            let effHour = hours;
            if (effMin === 60) { effMin = 0; effHour += 1; }

            let startMins = effHour * 60 + effMin;

            // 限制最早打卡时间为 6:00
            if (startMins < 6 * 60) {
                startMins = 6 * 60;
            }

            const targetWorkMins = 465;
            let currentNeed = targetWorkMins;
            let currentTime = startMins;
            let breakdown = [];

            const LUNCH_START = 12 * 60;
            const LUNCH_END = 13 * 60 + 45;
            const DINNER_START = 19 * 60;
            const DINNER_END = 19 * 60 + 30;
            const WORK_END_LIMIT = 21 * 60;

            if (currentTime < LUNCH_START && currentNeed > 0) {
                let available = LUNCH_START - currentTime;
                let workMins = Math.min(available, currentNeed);
                breakdown.push({ type: 'work', name: '上午工作', start: formatTime(currentTime), end: formatTime(currentTime + workMins), duration: workMins });
                currentTime += workMins;
                currentNeed -= workMins;
            }

            if (currentNeed > 0 && currentTime <= LUNCH_START) {
                breakdown.push({ type: 'break', name: '午休', start: formatTime(LUNCH_START), end: formatTime(LUNCH_END), desc: '(不计入工时)' });
                currentTime = Math.max(currentTime, LUNCH_END);
            }

            if (currentNeed > 0 && currentTime < DINNER_START) {
                let blockStart = Math.max(currentTime, LUNCH_END);
                let available = DINNER_START - blockStart;
                let workMins = Math.min(available, currentNeed);
                breakdown.push({ type: 'work', name: '下午工作', start: formatTime(blockStart), end: formatTime(blockStart + workMins), duration: workMins });
                currentTime = blockStart + workMins;
                currentNeed -= workMins;
            }

            if (currentNeed > 0 && currentTime <= DINNER_START) {
                breakdown.push({ type: 'break', name: '晚休', start: formatTime(DINNER_START), end: formatTime(DINNER_END), desc: '(不计入工时)' });
                currentTime = Math.max(currentTime, DINNER_END);
            }

            if (currentNeed > 0 && currentTime < WORK_END_LIMIT) {
                let blockStart = Math.max(currentTime, DINNER_END);
                let available = WORK_END_LIMIT - blockStart;
                let workMins = Math.min(available, currentNeed);
                breakdown.push({ type: 'work', name: '晚上工作', start: formatTime(blockStart), end: formatTime(blockStart + workMins), duration: workMins });
                currentTime = blockStart + workMins;
                currentNeed -= workMins;
            }

            document.getElementById('effectiveStart').innerText = formatTime(startMins);
            document.getElementById('targetEnd').innerText = formatTime(currentTime);

            let warningContainer = document.getElementById('warningBoxContainer');
            if (currentNeed > 0) {
                let workedMins = targetWorkMins - currentNeed;
                let workedHours = Math.floor(workedMins / 60);
                let workedRemainder = workedMins % 60;
                let workedText = workedHours > 0 ? `${workedHours}小时${workedRemainder}分钟` : `${workedRemainder}分钟`;

                let lackHours = Math.floor(currentNeed / 60);
                let lackRemainder = currentNeed % 60;
                let lackText = lackHours > 0 ? `${lackHours}小时${lackRemainder}分钟` : `${lackRemainder}分钟`;

                warningContainer.innerHTML = `
                    <div class="warning-box">
                        ⚠️ <strong>警告：工时不足！</strong><br>
                        21:00 后不计入工时，今天最多只能完成 <strong>${workedText}</strong>。<br>
                        (缺少 ${lackText})
                    </div>
                `;
            } else {
                warningContainer.innerHTML = '';
            }

            let timelineHtml = '';
            breakdown.forEach(item => {
                let colorClass = item.type === 'break' ? 'dot-break' : '';
                let nameColor = item.type === 'work' ? 'var(--primary-color)' : '#f59e0b';
                let durationText = item.type === 'work' ? `(${item.duration}分钟)` : item.desc;

                timelineHtml += `
                    <div class="timeline-item">
                        <div class="dot ${colorClass}"></div>
                        <span style="color: ${nameColor}; font-weight: 500;">${item.name}：</span>
                        <span class="time-range">${item.start} - ${item.end}</span>
                        <span class="duration">${durationText}</span>
                    </div>
                `;
            });

            document.getElementById('timelineContent').innerHTML = timelineHtml;
            document.getElementById('startBox').style.display = 'block';
            document.getElementById('endBox').style.display = 'block';
            document.getElementById('reasoningBox').style.display = 'block';
        }
    </script>
</body>

</html>
