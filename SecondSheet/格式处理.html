<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文排版辅助工具 - DOE与过程能力分析专用</title>
    
    <!-- 引入 Tailwind CSS 及 Typography 插件 (用于自动美化文章排版) -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- 引入 Marked.js (用于解析 Markdown 文本和表格) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- 配置并引入 MathJax (用于完美渲染 LaTeX 数学公式) -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']], // 支持 $...$ 行内公式
                displayMath: [['$$', '$$'], ['\\[', '\\]']], // 支持 $$...$$ 独立公式块
                processEscapes: true
            },
            startup: {
                pageReady: () => {
                    return MathJax.startup.defaultPageReady().then(() => {
                        // 初始化渲染
                        renderContent();
                    });
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* 自定义一些仿学术论文的样式细节 */
        .prose table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 1em;
            margin-bottom: 1em;
        }
        .prose th, .prose td {
            border: 1px solid #d1d5db; /* 单元格边框 */
            padding: 8px 12px;
            text-align: center; /* 表格内容居中 */
        }
        .prose th {
            background-color: #f3f4f6;
            font-weight: 600;
        }
        /* 隐藏滚动条但保留功能，界面更清爽 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- 顶部导航栏 -->
    <header class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center z-10 shrink-0">
        <div>
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                学术论文/DOE分析排版渲染器
            </h1>
            <p class="text-xs text-blue-200 mt-1">支持 Markdown 表格与 LaTeX 数学公式实时渲染 (如 $C_{pk}$, $\bar{X}$)</p>
        </div>
        <div class="flex items-center gap-3">
            <a href="../index.html" class="bg-white text-blue-800 hover:bg-blue-50 px-4 py-2 rounded-md font-semibold text-sm shadow flex items-center gap-2 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                返回主页
            </a>
            <span id="toast" class="text-sm text-green-300 opacity-0 transition-opacity duration-300">复制成功！请前往 Word 粘贴</span>
            <button onclick="copyRichText()" class="bg-white text-blue-800 hover:bg-blue-50 px-4 py-2 rounded-md font-semibold text-sm shadow flex items-center gap-2 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                </svg>
                一键复制至 Word
            </button>
        </div>
    </header>

    <!-- 主体编辑与预览区 -->
    <main class="flex-1 flex flex-col md:flex-row gap-4 p-4 overflow-hidden h-full">
        
        <!-- 左侧：输入区 -->
        <div class="w-full md:w-1/2 flex flex-col bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-gray-50 border-b border-gray-200 px-4 py-2 flex justify-between items-center shrink-0">
                <span class="text-sm font-semibold text-gray-700">✏️ 输入区 (请将 AI 生成的回复粘贴在此处)</span>
                <button onclick="clearInput()" class="flex items-center gap-1 px-2.5 py-1 text-xs font-medium text-gray-500 bg-white border border-gray-200 rounded-md hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-colors shadow-sm" title="清空输入区">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    清空
                </button>
            </div>
            <textarea id="markdown-input" class="flex-1 w-full p-4 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm leading-relaxed" placeholder="在此粘贴你的数据表或分析报告..."></textarea>
        </div>

        <!-- 右侧：渲染结果预览区 -->
        <div class="w-full md:w-1/2 flex flex-col bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden relative">
            <div class="bg-gray-50 border-b border-gray-200 px-4 py-2 flex justify-between items-center shrink-0">
                <span class="text-sm font-semibold text-gray-700">📄 渲染结果 (Word 直接可用格式)</span>
            </div>
            <!-- 加载提示 -->
            <div id="loading" class="absolute inset-0 bg-white/80 flex items-center justify-center z-10 hidden">
                <span class="text-blue-600 font-medium">公式渲染中...</span>
            </div>
            <!-- 实际内容显示区，使用 Tailwind Typography 插件进行排版美化 -->
            <div id="preview-output" class="flex-1 overflow-auto p-8 prose prose-blue max-w-none prose-h3:text-blue-800 prose-a:text-blue-600 prose-table:text-sm">
                <!-- 渲染内容将注入这里 -->
            </div>
        </div>

    </main>

    <script>
        const inputArea = document.getElementById('markdown-input');
        const outputArea = document.getElementById('preview-output');
        const loadingDiv = document.getElementById('loading');
        let timeoutId = null;

        // 默认放一段你的数据作为演示
        const defaultText = `### 五、小批量样本控制图与过程能力指数分析

这组在最优工艺参数下生产的 30 个小批量样本数据，目标公差设定为 2500 ± 100 N/mm。

**（一）最优工艺下的小批量验证数据表 (部分样本)**

| 子组序号 | 样本 1 ($X_1$) | 样本 2 ($X_2$) | 样本 3 ($X_3$) | 子组均值 ($\\bar{X}$) | 子组极差 ($R$) |
| :---: | :---: | :---: | :---: | :---: | :---: |
| 1 | 2480 | 2520 | 2500 | 2500.0 | 40 |
| 2 | 2525 | 2475 | 2500 | 2500.0 | 50 |

**（二）过程能力指数分析 ($C_{pk}$)**

计算过程：
1. $C_p$ (潜在过程能力):
$$C_p = \\frac{USL - LSL}{6\\hat{\\sigma}} = \\frac{2600 - 2400}{6 \\times 24.81} \\approx 1.34$$

2. $C_{pk}$ (实际过程能力):
$$C_{pk} = \\min\\left( \\frac{USL - \\overline{\\overline{X}}}{3\\hat{\\sigma}}, \\frac{\\overline{\\overline{X}} - LSL}{3\\hat{\\sigma}} \\right) = 1.34$$`;

        // 初始化
        inputArea.value = defaultText;

        // 核心渲染函数
        function renderContent() {
            const rawText = inputArea.value;
            
            // 1. 使用 marked.js 将 Markdown 转换为 HTML
            const htmlContent = marked.parse(rawText);
            outputArea.innerHTML = htmlContent;

            // 2. 调用 MathJax 渲染数学公式
            if (window.MathJax) {
                loadingDiv.classList.remove('hidden');
                MathJax.typesetPromise([outputArea]).then(() => {
                    loadingDiv.classList.add('hidden');
                }).catch((err) => {
                    console.error('公式渲染错误:', err);
                    loadingDiv.classList.add('hidden');
                });
            }
        }

        // 监听输入，带防抖功能 (避免每次按键都重新渲染卡顿)
        inputArea.addEventListener('input', () => {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(renderContent, 500); // 停止输入 500ms 后自动渲染
        });

        // 清空输入
        function clearInput() {
            inputArea.value = '';
            renderContent();
            inputArea.focus();
        }

        // 一键复制富文本到剪贴板 (适配 Word)
        function copyRichText() {
            // 选中输出区域的内容
            const range = document.createRange();
            range.selectNodeContents(outputArea);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);

            try {
                // 执行复制命令 (保留格式)
                document.execCommand('copy');
                
                // 显示成功提示
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0');
                setTimeout(() => {
                    toast.classList.add('opacity-0');
                }, 2000);
            } catch (err) {
                alert('复制失败，请手动在右侧区域使用 Ctrl+A 全选后 Ctrl+C 复制。');
            }
            
            // 取消选中状态，保持美观
            selection.removeAllRanges();
        }
    </script>
</body>
</html>
