<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的简历</title>
    <style>
        /* === 基础样式 === */
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            text-decoration: none;
            color: #555;
            font-weight: bold;
            background: white;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* 下载按钮 */
        .download-btn {
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
            transition: 0.3s;
        }

        .download-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        /* === PDF 容器 === */
        .pdf-container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            /* 占满剩余高度 */
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }

        /* 核心：嵌入 PDF 的标签 */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 手机端提示 (手机浏览器很难直接内嵌 PDF) */
        .mobile-hint {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 80%;
        }

        /* === 手机适配 === */
        @media (max-width: 768px) {

            /* 手机上隐藏 iframe，直接显示下载提示，体验更好 */
            iframe {
                display: none;
            }

            .mobile-hint {
                display: block;
            }

            .pdf-container {
                height: 300px;
                background: #f8f9fa;
            }
        }

        /* === 黑夜模式 === */
        body.dark-mode {
            background-color: #1a2340;
        }

        body.dark-mode .pdf-container {
            background-color: #2b324d;
        }

        body.dark-mode h1 {
            color: white;
        }

        body.dark-mode .back-btn {
            background: #333;
            color: white;
        }

        body.dark-mode .mobile-hint p {
            color: #ccc;
        }
    </style>
</head>

<body>

    <header>
        <a href="../index.html" class="back-btn">← 返回主页</a>
        <a href="../assets/resume/刘创诚.pdf" download="刘创诚.pdf" class="download-btn">
            ⬇ 下载 PDF
        </a>
    </header>

    <div class="pdf-container">
        <iframe src="../assets/resume/刘创诚.pdf" type="application/pdf">
        </iframe>

        <div class="mobile-hint">
            <p>📱 手机端预览可能受限</p>
            <p>建议点击右上角按钮下载查看</p>
            <a href="../assets/resume/刘创诚.pdf" class="download-btn"
                style="margin-top: 10px; display:inline-block;">下载简历</a>
        </div>
    </div>

    <script src="../assets/js/theme.js"></script>

</body>

</html>
